# Traefik static configuration (edge reverse proxy).
# Production: terminate TLS here (or at the WAF in front), add a `websecure` entrypoint and redirect HTTP→HTTPS.
entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      insecure: false        # do not trust client-supplied X-Forwarded-* headers
    transport:
      respondingTimeouts:
        readTimeout: 120s    # uploads
        idleTimeout: 60s

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
  insecure: false

log:
  level: INFO

accessLog:
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: drop      # never log Cookie/Authorization headers
  filters:
    statusCodes: ["400-599"]
